    TerminalRunSnapshot:
      allOf:
      - {$ref: '#/components/schemas/RunSnapshot'}
      - properties:
          status: {$ref: '#/components/schemas/TerminalStatus'}
          finished_at: {type: string, format: date-time}
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [run_id, sequence, type, at, data]
      properties:
        run_id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        type:
          type: string
          enum: [run.started, agent.created, agent.updated, step.updated, spawn.decided, run.finished, route.decided,
            tool.updated, tool.approval_decided, external.reconciled]
        at: {type: string, format: date-time}
        data: {type: object}
      allOf:
      - if:
          properties:
            type: {const: run.started}
          required: [type]
        then:
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status, base_planned_calls]
              properties:
                status:
                  type: string
                  enum: [queued, running]
                base_planned_calls: {type: integer, minimum: 1}
      - if:
          properties:
            type: {const: agent.created}
          required: [type]
        then:
          properties:
            data:
              type: object
              additionalProperties: false
              required: [agent_id, parent_agent_id, root_agent_id, depth, status, name, profile_id, provider, task]
              properties:
                agent_id: {type: string, format: uuid}
                parent_agent_id:
                  type: [string, 'null']
                  format: uuid
                root_agent_id: {type: string, format: uuid}
                depth: {type: integer, minimum: 0}
                status: {$ref: '#/components/schemas/AgentStatus'}
                name: {type: string, minLength: 1, maxLength: 80}
                profile_id: {$ref: '#/components/schemas/ProfileId'}
                provider: {$ref: '#/components/schemas/Provider'}
                task:
                  type: [string, 'null']
                  maxLength: 4000
      - if:
          properties:
            type: {const: agent.updated}
          required: [type]
        then:
          properties:
            data:
              type: object
              additionalProperties: false
              required: [agent_id, parent_agent_id, root_agent_id, depth, status]
              properties:
                agent_id: {type: string, format: uuid}
                parent_agent_id:
                  type: [string, 'null']
                  format: uuid
                root_agent_id: {type: string, format: uuid}
                depth: {type: integer, minimum: 0}
                status: {$ref: '#/components/schemas/AgentStatus'}
                name: {type: string, minLength: 1, maxLength: 80}
                profile_id: {$ref: '#/components/schemas/ProfileId'}
                provider: {$ref: '#/components/schemas/Provider'}
                task:
                  type: [string, 'null']
                  maxLength: 4000
      - if:
          properties:
            type: {const: step.updated}
          required: [type]
        then:
          properties:
            data:
              type: object
              additionalProperties: false
              required: [agent_id, parent_agent_id, root_agent_id, depth, step_id, stage, provider, status, harness_invocations,
                run_harness_invocations]
              properties:
                agent_id: {type: string, format: uuid}
                parent_agent_id:
                  type: [string, 'null']
                  format: uuid
                root_agent_id: {type: string, format: uuid}
                depth: {type: integer, minimum: 0}
                step_id: {type: string, format: uuid}
                stage:
                  type: string
                  enum: [draft, review, synthesis, helper]
                provider: {$ref: '#/components/schemas/Provider'}
                status: {$ref: '#/components/schemas/StepStatus'}
                output:
                  type: [string, 'null']
                  maxLength: 65536
                usage: {$ref: '#/components/schemas/Usage'}
                harness_invocations: {type: integer, minimum: 0}
                run_harness_invocations: {type: integer, minimum: 0}
              description: Lineage and step/run harness counts only; completed helper output/usage is scoped. Opaque
                internals may be unknown. Waiting tools/approval release permits; no private reasoning.
              allOf:
              - if:
                  properties:
                    stage: {const: helper}
                    status: {const: completed}
                  required: [stage, status]
                then:
                  required: [output, usage]
                  properties:
                    output: {type: string}
      - if:
          properties:
            type: {const: spawn.decided}
          required: [type]
        then:
          properties:
            data: {$ref: '#/components/schemas/SpawnDecision'}
      - if:
          properties:
            type: {const: run.finished}
          required: [type]
        then:
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status, harness_invocations, external_work_status]
              properties:
                status: {$ref: '#/components/schemas/TerminalStatus'}
                harness_invocations: {type: integer, minimum: 0}
                external_work_status:
                  type: string
                  enum: [none, settled, unknown, orphaned]
      - if:
          properties:
            type: {const: route.decided}
          required: [type]
        then:
          properties:
            data: {$ref: '#/components/schemas/RouteDecision'}
      - if:
          properties:
            type: {const: tool.updated}
          required: [type]
        then:
          properties:
            data: {$ref: '#/components/schemas/ToolExecution'}
      - if:
          properties:
            type: {const: tool.approval_decided}
          required: [type]
        then:
          properties:
            data: {$ref: '#/components/schemas/ToolApprovalResult'}
      - if:
          properties:
            type: {const: external.reconciled}
          required: [type]
        then:
          properties:
            data:
              type: object
              additionalProperties: false
              required: [tool_execution_id, invocation_id, external_status, usage, notice]
              properties:
                tool_execution_id:
                  type: [string, 'null']
                  format: uuid
                invocation_id:
                  type: [string, 'null']
                  format: uuid
                external_status: {$ref: '#/components/schemas/ExternalWorkStatus'}
                usage: {$ref: '#/components/schemas/Usage'}
                notice: {type: string, maxLength: 2000}
              description: Read-only external status/metering reconciliation, not auto-resume. Exactly one target
                ID is nonnull; validate it belongs to this run.
      description: Run-scoped durable numeric sequence. Lineage, routes, exact-action approvals and bounded tool
        results are typed events. Scope counters to observable harness/operations/jobs; never infer hidden internal
        work. Terminal state stays immutable; separately labeled external reconciliation can append records without
        restarting work.
    ConversationExport:
      type: object
      additionalProperties: false
      required: [export_version, exported_at, conversation, messages, runs]
      properties:
        export_version: {type: integer, const: 1}
        exported_at: {type: string, format: date-time}
        conversation: {$ref: '#/components/schemas/Conversation'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        runs:
          type: array
          items: {$ref: '#/components/schemas/TerminalRunSnapshot'}
      description: Complete logical terminal-run export, including all tool execution pages, routes, human decisions,
        source retrieval/support provenance, descendants and scoped usage. No credentials/raw vendor/private reasoning
        traces. Does not imply remote work was canceled or external data erased.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_cursor, invalid_event_id, unauthorized, forbidden, not_found, run_in_progress,
                idempotency_conflict, body_too_large, validation_failed, context_too_large, live_disabled, rate_limited,
                internal_error, profile_not_configured, delegation_not_supported, capability_unavailable, tool_not_allowed,
                grant_not_found, approval_conflict, backend_not_ready, unsupported_bounds, runtime_policy_changed]
            message: {type: string, maxLength: 500}
            request_id: {type: string, format: uuid}
            details:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field: {type: string, maxLength: 200}
                  code: {type: string, maxLength: 100}
    ProfileId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_-]{0,63}$
      description: Stable server-configured model-profile slug; no client-supplied model IDs or keys.
    DelegationCapability:
      type: string
      enum: [supported, unsupported, unverified]
      description: supported means the adapter/profile internal delegation round trip was compatibility checked.
        Configuration alone is not support; no vendor-native agent service is implied.
    ModelProfile:
      type: object
      additionalProperties: false
      required: [profile_id, model_id, safe_input_tokens, readiness, delegation_capability, execution_backend_id,
        execution_controls]
      properties:
        profile_id: {$ref: '#/components/schemas/ProfileId'}
        model_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
        safe_input_tokens:
          type: [integer, 'null']
          minimum: 1
        readiness:
          type: string
          enum: [configured, missing]
        delegation_capability: {$ref: '#/components/schemas/DelegationCapability'}
        execution_backend_id: {$ref: '#/components/schemas/BackendId'}
        execution_controls: {$ref: '#/components/schemas/ExecutionControls'}
      description: Server-configured profile and backend/capacity/control metadata. Repeated provider/model/profile
        agents remain distinct. Readiness is configuration only; keys and raw auth state never appear. Missing capacities/control
        mappings make a demanding route ineligible.
      allOf:
      - if:
          properties:
            readiness: {const: configured}
          required: [readiness]
        then:
          properties:
            model_id: {type: string}
            safe_input_tokens: {type: integer}
    AgentDefinition:
      type: object
      additionalProperties: false
      required: [agent_id, name, profile_id]
      properties:
        agent_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        profile_id: {$ref: '#/components/schemas/ProfileId'}
        role: {type: string, minLength: 1, maxLength: 500}
      description: Root identity is independent of provider/profile. Agent IDs must be unique within a run; repeated
        profile/provider is allowed. Role text cannot expand permissions.
    DelegationInput:
      type: object
      additionalProperties: false
      required: []
      properties:
        enabled: {type: boolean}
        allowed_profile_ids:
          type: array
          items: {$ref: '#/components/schemas/ProfileId'}
          minItems: 0
          uniqueItems: true
      description: 'Defaults: Team enabled, Quick disabled; allowed_profile_ids empty. The allowlist grants alternate
        child profiles only; inheritance uses the parent profile. Resolve and freeze permission at run admission.
        Model text cannot expand it.'
    DelegationPolicy:
      allOf:
      - {$ref: '#/components/schemas/DelegationInput'}
      - required: [enabled, allowed_profile_ids]
    AgentStatus:
      type: string
      enum: [queued, running, waiting_for_children, waiting_for_tool, awaiting_approval, completed, failed, canceled,
        interrupted]
    InvocationSnapshot:
      type: object
      additionalProperties: false
      required: [invocation_id, kind, retry_of_invocation_id, resumes_after_invocation_id, status, usage, failure,
        started_at, finished_at, execution_backend_id, external_status, native_job_id, bounds_mode, execution_controls,
        deadline_at]
      properties:
        invocation_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [initial, continuation, retry]
        retry_of_invocation_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed, timed_out, canceled, interrupted]
        usage: {$ref: '#/components/schemas/Usage'}
        failure:
          oneOf:
          - {$ref: '#/components/schemas/NormalizedFailure'}
          - {type: 'null'}
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        resumes_after_invocation_id:
          type: [string, 'null']
          format: uuid
        execution_backend_id: {$ref: '#/components/schemas/BackendId'}
        external_status: {$ref: '#/components/schemas/ExternalWorkStatus'}
        native_job_id:
          type: [string, 'null']
          maxLength: 200
        bounds_mode:
          type: string
          enum: [strict, bounded_job]
        execution_controls: {$ref: '#/components/schemas/ExecutionControls'}
        deadline_at: {type: string, format: date-time}
      description: One reserved/dispatched adapter call. A tool-request response can complete an invocation while
        the step waits; a continuation is a new counted call. Schedule one logical continuation per parent invocation
        response batch, never per duplicate callback; resumes_after_invocation_id identifies it. A bounded safe
        retry may be a separate retry invocation of that continuation. At most one retry per logical step across
        its entire initial/continuation sequence, only a known pre-generation rejection. Initial calls have null
        retry/resume IDs; retries name the rejected invocation. Queued records do not count as dispatched. Cross-record
        references stay in the same parent step/run. One observable harness invocation can wrap many server-tool/SDK
        internal operations; usage declares scope rather than treating that whole job as one internal call. Capture
        native job ID/control/deadline/external status when relevant; unconfirmed remote stop remains unknown/orphaned.
      allOf:
      - if:
          properties:
            kind: {const: initial}
          required: [kind]
        then:
          properties:
            resumes_after_invocation_id: {type: 'null'}
            retry_of_invocation_id: {type: 'null'}
      - if:
          properties:
            kind: {const: continuation}
          required: [kind]
        then:
          properties:
            resumes_after_invocation_id: {type: string, format: uuid}
            retry_of_invocation_id: {type: 'null'}
      - if:
          properties:
            kind: {const: retry}
          required: [kind]
        then:
          properties:
            retry_of_invocation_id: {type: string, format: uuid}
    SpawnRequest:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task: {type: string, minLength: 1, maxLength: 4000}
        name: {type: string, minLength: 1, maxLength: 80}
        profile_id: {$ref: '#/components/schemas/ProfileId'}
      description: Adapter-neutral internal spawn_subagent tool arguments, not a browser endpoint. Parent/run/step/tool-call
        IDs come from trusted coordinator context, not model arguments. Omitted profile inherits parent; an alternate
        must be preapproved in delegation.allowed_profile_ids. Model text cannot grant itself permissions.
    SpawnDenialCode:
      type: string
      enum: [disabled, profile_not_allowed, depth_limit, agent_limit, child_limit, call_budget, output_budget, deadline,
        context_too_large, invalid_request]
      description: Safe visible policy/quota reason. Invalid/unready/incompatible profile, conflicting tool-call
        payload or malformed arguments use invalid_request; no child is created.
    SpawnDecision:
      type: object
      additionalProperties: false
      required: [decision_id, run_id, parent_agent_id, step_id, parent_invocation_id, provider_tool_call_id, request,
        effective_profile_id, status, child_agent_id, denial_code, notice, created_at]
      properties:
        decision_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        parent_agent_id: {type: string, format: uuid}
        step_id: {type: string, format: uuid}
        provider_tool_call_id: {type: string, minLength: 1, maxLength: 200}
        request:
          oneOf:
          - {$ref: '#/components/schemas/SpawnRequest'}
          - {type: 'null'}
        effective_profile_id:
          oneOf:
          - {$ref: '#/components/schemas/ProfileId'}
          - {type: 'null'}
        status:
          type: string
          enum: [accepted, denied]
        child_agent_id:
          type: [string, 'null']
          format: uuid
        denial_code:
          oneOf:
          - {$ref: '#/components/schemas/SpawnDenialCode'}
          - {type: 'null'}
        notice: {type: string, maxLength: 1000}
        created_at: {type: string, format: date-time}
        parent_invocation_id: {type: string, format: uuid}
      description: Durable bounded decision. Idempotency tuple is run,parent,step,parent_invocation_id,provider_tool_call_id
        plus normalized request digest. Server derives ancestry/invocation IDs. Matching replays return the original
        decision/child; changed payload is invalid_request without replacing the original or creating another child.
        The same provider tool-call ID from another invocation is a new request subject to lifetime quotas. A malformed
        request records request=null and a safe notice rather than raw arguments. Acceptance atomically reserves
        child initial work, one logical parent continuation per response batch and remaining required root work.
        Denial itself dispatches no call; a normal continuation still needs budget. Denial alone is not partial;
        accepted-child failure is. All lifetime/depth/call/output checks use the snapshotted runtime policy. A native
        opaque backend cannot bypass caller/grant/context restrictions or masquerade its hidden subagents as fully
        observed harness nodes.
      allOf:
      - if:
          properties:
            status: {const: accepted}
          required: [status]
        then:
          properties:
            child_agent_id: {type: string, format: uuid}
            denial_code: {type: 'null'}
            effective_profile_id: {$ref: '#/components/schemas/ProfileId'}
            request: {$ref: '#/components/schemas/SpawnRequest'}
        else:
          properties:
            child_agent_id: {type: 'null'}
            denial_code: {$ref: '#/components/schemas/SpawnDenialCode'}
      examples:
      - decision_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1
        run_id: 11111111-1111-4111-8111-111111111111
        parent_agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
        step_id: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
        provider_tool_call_id: call-helper-1
        request: {task: Check the arithmetic in the supplied figures., name: Arithmetic helper}
        effective_profile_id: openai-default
        status: accepted
        child_agent_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1
        denial_code: null
        notice: Accepted within the run limits; one child call and a parent continuation are reserved.
        created_at: '2026-10-17T02:00:00Z'
        parent_invocation_id: dddddddd-dddd-4ddd-8ddd-ddddddddddd1
    BackendId: {type: string, maxLength: 100, minLength: 1, pattern: '^[a-z][a-z0-9_.:-]*$'}
    CapabilityId: {type: string, maxLength: 160, minLength: 1, pattern: '^[a-z][a-z0-9_.:-]*$'}
    ToolId: {type: string, maxLength: 160, minLength: 1, pattern: '^[a-z][a-z0-9_.:-]*$'}
    ArgumentDigest: {type: string, maxLength: 71, minLength: 71, pattern: '^sha256:[0-9a-f]{64}$'}
    BackendKind:
      type: string
      enum: [provider_api, agent_sdk_cli, mcp_local, hosted_agent]
    ExecutionBackend:
      type: object
      additionalProperties: false
      required: [backend_id, kind, version, readiness]
      properties:
        backend_id: {$ref: '#/components/schemas/BackendId'}
        kind: {$ref: '#/components/schemas/BackendKind'}
        version: {type: string, maxLength: 200, minLength: 1}
        readiness:
          type: string
          enum: [configured, missing_auth, disabled, unsupported, unverified]
      description: Versioned configured execution route, not a universal provider capability. No credentials or
        automatic login/discovery calls.
    CompatibilityEvidence:
      type: object
      additionalProperties: false
      required: [status, checked_at, supported_modes, source_urls, notes]
      properties:
        status:
          type: string
          enum: [documented, tested, unsupported, unknown]
        checked_at:
          type: [string, 'null']
          format: date-time
        supported_modes:
          type: array
          items: {type: string, maxLength: 80, minLength: 1}
          minItems: 0
          uniqueItems: true
        source_urls:
          type: array
          items: {type: string, format: uri}
          minItems: 0
          maxItems: 20
        notes: {type: string, maxLength: 2000}
      description: Documentation evidence is distinct from tested compatibility and current availability. Record
        exact backend/tool/model/mode versions before marking tested.
    AuthRequirements:
      type: object
      additionalProperties: false
      required: [methods, status, required_scopes]
      properties:
        methods:
          type: array
          items: {type: string, maxLength: 80, minLength: 1}
          minItems: 0
          uniqueItems: true
        status:
          type: string
          enum: [configured, missing, needs_auth, not_required]
        required_scopes:
          type: array
          items: {type: string, maxLength: 200, minLength: 1}
          minItems: 0
          uniqueItems: true
      description: Auth method labels and scope/readiness only. No keys, OAuth/session tokens, raw headers or subscription
        credentials. API-key and user-authorized unmodified CLI flows remain separate routes.
    PermissionRequirements:
      type: object
      additionalProperties: false
      required: [required_scopes, side_effect_class, grant_scopes, approval_available]
      properties:
        required_scopes:
          type: array
          items: {type: string, maxLength: 200, minLength: 1}
          minItems: 0
          uniqueItems: true
        side_effect_class:
          type: string
          enum: [read_only, reversible_write, external_write, destructive, mixed]
        grant_scopes:
          type: array
          items:
            type: string
            enum: [task, session, action]
          minItems: 0
          uniqueItems: true
        approval_available: {type: boolean}
      description: A matching existing task/session grant can authorize suitable actions without another prompt.
        Some exact actions require action approval. Model text cannot issue grants.
    EgressMetadata:
      type: object
      additionalProperties: false
      required: [execution_location, destinations, sends_context, notes]
      properties:
        execution_location:
          type: string
          enum: [our_host, provider, third_party, mixed]
        destinations:
          type: array
          items: {type: string, maxLength: 2048, minLength: 1}
          minItems: 0
          uniqueItems: true
        sends_context: {type: boolean}
        notes: {type: string, maxLength: 2000}
      description: Known permitted destination patterns and context flow. Runtime enforces scope, including redirects;
        self-hosting does not keep remote provider/MCP data local.
    ObservabilityMetadata:
      type: object
      additionalProperties: false
      required: [internal_usage_visibility, internal_model_counts_available, internal_tool_counts_available, cancellation,
        notes]
      properties:
        internal_usage_visibility:
          type: string
          enum: [complete, partial, opaque, unknown]
        internal_model_counts_available: {type: boolean}
        internal_tool_counts_available: {type: boolean}
        cancellation:
          type: string
          enum: [confirmed_remote, best_effort, local_only, unavailable]
        notes: {type: string, maxLength: 2000}
    ExecutionControls:
      type: object
      additionalProperties: false
      required: [strict_bounds_supported, supported_controls, max_internal_model_invocations, max_internal_tool_operations,
        max_job_seconds, job_deadline_enforced, tool_permission_gate, context_isolation, notes]
      properties:
        strict_bounds_supported: {type: boolean}
        supported_controls:
          type: array
          items: {type: string, maxLength: 100, minLength: 1}
          minItems: 0
          uniqueItems: true
        max_internal_model_invocations:
          type: [integer, 'null']
          minimum: 0
        max_internal_tool_operations:
          type: [integer, 'null']
          minimum: 0
        max_job_seconds:
          type: [integer, 'null']
          minimum: 1
        job_deadline_enforced: {type: boolean}
        tool_permission_gate:
          type: string
          enum: [before_each, pre_scoped, unavailable]
        context_isolation:
          type: string
          enum: [verified, unsupported, unknown]
        notes: {type: string, maxLength: 2000}
      description: Finite configured/enforceable backend execution caps, or null when unavailable. Strict admission
        requires every requested control to map to enforcement. Bounded-job use of opaque internals requires explicit
        opt-in and an enforced job/launch deadline. No monetary guarantee. Enforce delegation_disabled when helpers
        are off; inability to prevent native helper spawning cannot be excused by opaque-usage opt-in. Direct request/job-launch
        acknowledgement deadlines are distinct from the supervised native-job lifetime; each job is bounded by remaining
        run time and its snapshotted execution cap.
    CapabilityMetadata:
      type: object
      additionalProperties: false
      required: [capability_id, tool_id, provider, profile_id, backend, manifest_version, tool_version, description,
        compatibility, readiness, authentication, permissions, egress, observability, execution_controls, arguments_schema]
      properties:
        capability_id: {$ref: '#/components/schemas/CapabilityId'}
        tool_id: {$ref: '#/components/schemas/ToolId'}
        provider: {$ref: '#/components/schemas/Provider'}
        profile_id: {$ref: '#/components/schemas/ProfileId'}
        backend: {$ref: '#/components/schemas/ExecutionBackend'}
        manifest_version: {type: string, maxLength: 200, minLength: 1}
        tool_version: {type: string, maxLength: 200, minLength: 1}
        description: {type: string, maxLength: 2000}
        compatibility: {$ref: '#/components/schemas/CompatibilityEvidence'}
        readiness:
          type: string
          enum: [configured, missing_auth, disabled, unsupported, unverified]
        authentication: {$ref: '#/components/schemas/AuthRequirements'}
        permissions: {$ref: '#/components/schemas/PermissionRequirements'}
        egress: {$ref: '#/components/schemas/EgressMetadata'}
        observability: {$ref: '#/components/schemas/ObservabilityMetadata'}
        execution_controls: {$ref: '#/components/schemas/ExecutionControls'}
        arguments_schema: {type: object, description: 'Validated tool JSON Schema supplied by the registered manifest;
            data, never executable client code.'}
      description: Versioned tool/profile/backend metadata; not universal support for a provider or model. Catalog
        reads never call tools or verify credentials.
    CapabilityPage:
      type: object
      additionalProperties: false
      required: [catalog_version, items, next_cursor]
      properties:
        catalog_version: {type: string, maxLength: 100, minLength: 1}
        items:
          type: array
          items: {$ref: '#/components/schemas/CapabilityMetadata'}
          minItems: 0
          maxItems: 100
        next_cursor:
          type: [string, 'null']
          maxLength: 2048
    ToolPolicyInput:
      type: object
      additionalProperties: false
      required: []
      properties:
        mode:
          type: string
          enum: [auto, 'off']
        allowed_tool_ids:
          type: array
          items: {$ref: '#/components/schemas/ToolId'}
          minItems: 0
          uniqueItems: true
        allowed_backend_ids:
          type: array
          items: {$ref: '#/components/schemas/BackendId'}
          minItems: 0
          uniqueItems: true
        allowed_profile_ids:
          type: array
          items: {$ref: '#/components/schemas/ProfileId'}
          minItems: 0
          uniqueItems: true
        grant_refs:
          type: array
          items: {type: string, format: uuid}
          minItems: 0
          uniqueItems: true
        missing_grant:
          type: string
          enum: [pause, block]
          default: pause
        bounds_mode:
          type: string
          enum: [strict, bounded_job]
          default: strict
        required_controls:
          type: array
          items: {type: string, maxLength: 100, minLength: 1}
          minItems: 0
          uniqueItems: true
        allow_unknown_internal_usage: {type: boolean, default: false}
      description: Team mode defaults auto, Quick off. Allowlist/grant fields default to the user's existing authorized
        selection (empty if none), resolved and frozen at admission; never implicitly all catalog entries. Models
        cannot mint grants or add destinations. Auto selects only compatible authorized direct/helper routes. Alternate
        helper profiles must satisfy relevant delegation/tool permissions. A matching task/session grant avoids
        needless reapproval. Missing grants pause an exact action or block it; incompatible/forbidden routes cannot
        be approved into existence. Strict requires enforceable requested bounds; bounded_job plus allow_unknown_internal_usage=true
        explicitly permits opaque internals under a finite job deadline. Tool-created managed helpers require delegation.enabled.
        Helpers-off must disable native/runtime helper spawning too; a backend unable to enforce that permission
        boundary is ineligible even for bounded-job mode. Initial selection/grant references stay frozen; recheck
        expiration/revocation and required scope before each dispatch. A broader configuration change requires a
        new run. required_controls is combined with mandatory deployment controls, not a way to remove them. Deadline
        enforcement scope and remote-cancellation limitations must be disclosed by backend metadata; a local supervisor
        timeout does not prove remote work stopped.
      allOf:
      - if:
          properties:
            bounds_mode: {const: bounded_job}
          required: [bounds_mode]
        then:
          required: [allow_unknown_internal_usage]
          properties:
            allow_unknown_internal_usage: {const: true}
      - if:
          properties:
            allow_unknown_internal_usage: {const: true}
          required: [allow_unknown_internal_usage]
        then:
          required: [bounds_mode]
          properties:
            bounds_mode: {const: bounded_job}
    ToolPolicy:
      allOf:
      - {$ref: '#/components/schemas/ToolPolicyInput'}
      - required: [mode, allowed_tool_ids, allowed_backend_ids, allowed_profile_ids, grant_refs, missing_grant,
          bounds_mode, required_controls, allow_unknown_internal_usage]
    RunLimitCeilings:
      type: object
      additionalProperties: false
      required: [max_harness_invocations, max_tool_operations, max_native_jobs, concurrency, per_provider_concurrency,
        overall_timeout_seconds, per_call_timeout_seconds, max_native_job_seconds, max_output_tokens_per_call, total_output_tokens,
        max_retries_per_step, max_root_agents, max_total_agents, max_spawned_agents, max_children_per_agent, max_depth]
      properties:
        max_harness_invocations: {type: integer, minimum: 1}
        max_tool_operations: {type: integer, minimum: 0}
        max_native_jobs: {type: integer, minimum: 0}
        concurrency: {type: integer, minimum: 1}
        per_provider_concurrency: {type: integer, minimum: 1}
        overall_timeout_seconds: {type: integer, minimum: 15}
        per_call_timeout_seconds: {type: integer, minimum: 1}
        max_native_job_seconds: {type: integer, minimum: 1}
        max_output_tokens_per_call: {type: integer, minimum: 1}
        total_output_tokens: {type: integer, minimum: 1}
        max_retries_per_step: {type: integer, minimum: 0, maximum: 1}
        max_root_agents: {type: integer, minimum: 1}
        max_total_agents: {type: integer, minimum: 1}
        max_spawned_agents: {type: integer, minimum: 0}
        max_children_per_agent: {type: integer, minimum: 0}
        max_depth: {type: integer, minimum: 0}
      description: Finite operator-enforced ceilings for each request bound. Values are deployment configuration,
        not user/model authority; defaults and effective limits must not exceed them. All counts/deadlines are finite
        integers.
    RuntimePolicy:
      type: object
      additionalProperties: false
      required: [policy_version, updated_at, defaults, deployment_ceilings, default_tool_modes, default_delegation,
        review_topologies, required_controls]
      properties:
        policy_version: {type: string, maxLength: 100, minLength: 1}
        updated_at: {type: string, format: date-time}
        defaults: {$ref: '#/components/schemas/RunLimits'}
        deployment_ceilings: {$ref: '#/components/schemas/RunLimitCeilings'}
        default_tool_modes:
          type: object
          additionalProperties: false
          required: [quick, team]
          properties:
            quick: {type: string, const: 'off'}
            team: {type: string, const: auto}
        default_delegation:
          type: object
          additionalProperties: false
          required: [quick, team]
          properties:
            quick: {type: boolean, const: false}
            team: {type: boolean, const: true}
        review_topologies:
          type: array
          items:
            type: string
            enum: [all_peers]
          minItems: 1
          uniqueItems: true
        required_controls:
          type: array
          items: {type: string, minLength: 1, maxLength: 100}
          uniqueItems: true
      description: Read-only effective server policy. Future topology/ceiling changes need implementation validation;
        clients cannot increase ceilings by sending a policy object. One global active run remains the personal-deployment
        default. Effective requested controls include the union of mandatory server controls and user-requested
        controls; a client cannot remove mandatory grant/context/security controls.
    ExternalWorkStatus:
      type: string
      enum: [not_started, running, completed, failed, cancellation_requested, canceled, unknown, orphaned]
      description: External truth/status is distinct from immutable local workflow state. An unconfirmed stop is
        unknown/orphaned, never assumed canceled or reversed.
    ToolInvocationRequest:
      type: object
      additionalProperties: false
      required: [capability_id, arguments]
      properties:
        capability_id: {$ref: '#/components/schemas/CapabilityId'}
        tool_id: {$ref: '#/components/schemas/ToolId'}
        task: {type: string, maxLength: 4000, minLength: 1}
        arguments: {type: object, description: 'Validate against the selected registered tool schema and configured
            byte/depth limits (initial safe default 16 KiB). No auth headers, raw credentials, policy or caller
            identity fields. Never execute before policy resolution.'}
      description: Internal model request, not browser authentication or permission. Coordinator supplies caller/run/step/parent
        invocation/tool-call IDs; optional specific tool does not bypass the frozen capability/profile/backend/grant
        scope.
    RouteDecision:
      type: object
      additionalProperties: false
      required: [route_decision_id, tool_execution_id, run_id, agent_id, step_id, parent_invocation_id, provider_tool_call_id,
        capability_id, route, selected_tool_id, selected_profile_id, selected_backend_id, delegated_agent_id, grant_refs,
        policy_version, catalog_version, reason_code, notice, created_at]
      properties:
        route_decision_id: {type: string, format: uuid}
        tool_execution_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        step_id: {type: string, format: uuid}
        parent_invocation_id: {type: string, format: uuid}
        provider_tool_call_id: {type: string, maxLength: 200, minLength: 1}
        capability_id: {$ref: '#/components/schemas/CapabilityId'}
        route:
          type: string
          enum: [direct, delegated, awaiting_approval, blocked, unavailable]
        selected_tool_id:
          oneOf:
          - {$ref: '#/components/schemas/ToolId'}
          - {type: 'null'}
        selected_profile_id:
          oneOf:
          - {$ref: '#/components/schemas/ProfileId'}
          - {type: 'null'}
        selected_backend_id:
          oneOf:
          - {$ref: '#/components/schemas/BackendId'}
          - {type: 'null'}
        delegated_agent_id:
          type: [string, 'null']
          format: uuid
        grant_refs:
          type: array
          items: {type: string, format: uuid}
          minItems: 0
          uniqueItems: true
        policy_version: {type: string, maxLength: 100, minLength: 1}
        catalog_version: {type: string, maxLength: 100, minLength: 1}
        reason_code: {type: string, maxLength: 100, minLength: 1}
        notice: {type: string, maxLength: 2000}
        created_at: {type: string, format: date-time}
      description: Durable exact routing decision under frozen policy. Direct chooses a compatible permitted native
        route; delegated chooses an already approved helper profile/backend. No eligible route is unavailable/blocked,
        never a new destination or changed root synthesizer. Awaiting approval cannot repair an incompatible/out-of-scope
        route. Match request identity/digest for replay; distinct decisions may record approval-driven transitions
        of one execution. Delegated routes require delegation.enabled; auto tool mode cannot override helpers-off
        or create a hidden managed child.
    PendingToolApproval:
      type: object
      additionalProperties: false
      required: [approval_request_id, argument_digest, action_preview, required_scopes, created_at, expires_at]
      properties:
        approval_request_id: {type: string, format: uuid}
        argument_digest: {$ref: '#/components/schemas/ArgumentDigest'}
        action_preview: {type: string, maxLength: 16000, minLength: 1}
        required_scopes:
          type: array
          items: {type: string, maxLength: 200, minLength: 1}
          minItems: 0
          uniqueItems: true
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
      description: One pending exact action bound server-side to run, execution, caller, tool/profile/backend, task
        and policy version. Preview contains all nonsecret normalized arguments and credential-scope references,
        never secret values. Changed action requires another pending record; no broad grant.
    ToolApprovalInput:
      type: object
      additionalProperties: false
      required: [approval_request_id, tool_execution_id, argument_digest, decision]
      properties:
        approval_request_id: {type: string, format: uuid}
        tool_execution_id: {type: string, format: uuid}
        argument_digest: {$ref: '#/components/schemas/ArgumentDigest'}
        decision:
          type: string
          enum: [approve, deny]
      description: Human UI response for a pending exact action. CSRF/Origin/session plus Idempotency-Key required.
        Server verifies all bindings/scope/run state; models cannot approve or mint grants. Approval records consent,
        not completed execution. The approval UI and its session/CSRF credentials must be inaccessible to agent-controlled
        browsers, shells and MCP environments; Origin/CSRF alone does not prove a human action.
    ToolApprovalResult:
      type: object
      additionalProperties: false
      required: [approval_request_id, tool_execution_id, argument_digest, decision, grant_ref, notice, decided_at]
      properties:
        approval_request_id: {type: string, format: uuid}
        tool_execution_id: {type: string, format: uuid}
        argument_digest: {$ref: '#/components/schemas/ArgumentDigest'}
        decision:
          type: string
          enum: [approve, deny]
        grant_ref:
          type: [string, 'null']
          format: uuid
        notice: {type: string, maxLength: 2000}
        decided_at: {type: string, format: date-time}
      description: Stable decision replay; same idempotency key/payload returns original. Conflicting payload/decision
        or stale action returns 409. An action-scoped server grant may be created only for a valid human approval;
        never widen run allowlists. Persist one decision per pending approval; duplicate approval requests/callbacks
        do not issue another grant, execute again or resume the parent twice.
    ToolExecution:
      type: object
      additionalProperties: false
      required: [tool_execution_id, sequence, run_id, agent_id, step_id, parent_invocation_id, provider_tool_call_id,
        request, argument_digest, arguments_preview, route_decisions, approval, status, execution_backend_id, native_job_id,
        external_status, bounds_mode, execution_controls, deadline_at, result, sources, usage, limitations, created_at,
        updated_at, finished_at]
      properties:
        tool_execution_id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        run_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        step_id: {type: string, format: uuid}
        parent_invocation_id: {type: string, format: uuid}
        provider_tool_call_id: {type: string, maxLength: 200, minLength: 1}
        request:
          oneOf:
          - {$ref: '#/components/schemas/ToolInvocationRequest'}
          - {type: 'null'}
        argument_digest:
          oneOf:
          - {$ref: '#/components/schemas/ArgumentDigest'}
          - {type: 'null'}
        arguments_preview: {type: string, maxLength: 16000}
        route_decisions:
          type: array
          items: {$ref: '#/components/schemas/RouteDecision'}
          minItems: 0
        approval:
          oneOf:
          - {$ref: '#/components/schemas/PendingToolApproval'}
          - {type: 'null'}
        status:
          type: string
          enum: [routing, awaiting_approval, queued, running, completed, failed, blocked, unavailable, denied, canceled,
            unknown, orphaned]
        execution_backend_id:
          oneOf:
          - {$ref: '#/components/schemas/BackendId'}
          - {type: 'null'}
        native_job_id:
          type: [string, 'null']
          maxLength: 200
        external_status: {$ref: '#/components/schemas/ExternalWorkStatus'}
        bounds_mode:
          type: string
          enum: [strict, bounded_job]
        execution_controls:
          oneOf:
          - {$ref: '#/components/schemas/ExecutionControls'}
          - {type: 'null'}
        deadline_at:
          type: [string, 'null']
          format: date-time
        result:
          type: [string, 'null']
          maxLength: 65536
        sources:
          type: array
          items: {$ref: '#/components/schemas/Source'}
          minItems: 0
        usage: {$ref: '#/components/schemas/Usage'}
        limitations:
          type: array
          items: {type: string, maxLength: 2000}
          minItems: 0
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at:
          type: [string, 'null']
          format: date-time
      description: Bounded normalized action/result ledger, not unrestricted vendor traces. Every execution has
        stable sequence, caller/invocation identity and exact digest; duplicate callbacks cannot execute twice.
        Grants/routes and pending approval remain bound to the exact action. Unknown/orphaned external status is
        not fake cancellation. Results are inert content. Denials alone need not make a run partial; an unfinished
        required action/stage does. Later external status/metering reconciliation can update this separate record
        after run terminal state, without changing workflow outcome or launching work.
      examples:
      - tool_execution_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1
        sequence: 1
        run_id: 11111111-1111-4111-8111-111111111111
        agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
        step_id: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
        parent_invocation_id: dddddddd-dddd-4ddd-8ddd-ddddddddddd1
        provider_tool_call_id: call-search-1
        request:
          capability_id: web.search
          arguments: {query: Source for the supplied public claim}
        argument_digest: sha256:8d65bc5c613a55376a5e4353e4eef3ce41f8db15be41108fb937fa6c548ff4ea
        arguments_preview: 'query: Source for the supplied public claim'
        route_decisions:
        - route_decision_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee2
          tool_execution_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1
          run_id: 11111111-1111-4111-8111-111111111111
          agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
          step_id: cccccccc-cccc-4ccc-8ccc-ccccccccccc1
          parent_invocation_id: dddddddd-dddd-4ddd-8ddd-ddddddddddd1
          provider_tool_call_id: call-search-1
          capability_id: web.search
          route: direct
          selected_tool_id: anthropic.web_search
          selected_profile_id: anthropic-search
          selected_backend_id: anthropic-messages
          delegated_agent_id: null
          grant_refs: [ffffffff-ffff-4fff-8fff-fffffffffff1]
          policy_version: personal-v2
          catalog_version: catalog-v2
          reason_code: matching_task_grant
          notice: Illustrative authorized direct search; no actual request was made.
          created_at: '2026-10-17T02:00:00Z'
        approval: null
        status: completed
        execution_backend_id: anthropic-messages
        native_job_id: null
        external_status: completed
        bounds_mode: strict
        execution_controls:
          strict_bounds_supported: true
          supported_controls: [harness_invocations, tool_operations, deadline, context_isolation, delegation_disabled]
          max_internal_model_invocations: 1
          max_internal_tool_operations: 1
          max_job_seconds: 120
          job_deadline_enforced: true
          tool_permission_gate: before_each
          context_isolation: verified
          notes: Illustrative deterministic mock control mapping, not a tested live backend.
        deadline_at: '2026-10-17T02:00:45Z'
        result: Illustrative search result; support has not been assessed.
        sources:
        - claim: The source discusses the supplied claim.
          reference: https://example.com/source
          provenance: provider_tool
          retrieval_status: retrieved
          retrieved_at: '2026-10-17T02:00:01Z'
          tool_execution_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1
          origin: https://example.com
          location: Illustrative retrieved excerpt
          support_status: unassessed
          assessment_method: none
          support_checked_at: null
          assessment_note: Retrieved does not mean verified.
        usage:
          harness_invocations: 1
          tool_operations_observed: 1
          native_jobs_started: 0
          internal_usage_visibility: complete
          internal_model_invocations: 0
          internal_tool_operations: 0
          input_tokens: null
          output_tokens: null
