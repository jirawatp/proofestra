openapi: 3.1.1
info:
  title: Proofestra local API
  version: 0.1.0-draft
  summary: Proposed extensible personal API; no runtime, tool executor or endpoint is implemented.
  description: Draft same-origin personal UI contract. Provider IDs/catalogs are extensible through validated adapter
    manifests; the initial three targets are not a fixed enum. Profiles identify execution backends and versioned
    capability/control metadata. No provider SDK, CLI, API or tool execution is implemented. Validate Host/session/CSRF/Origin,
    disable CORS, enforce a 128 KiB body maximum, and use no-store plus X-Request-ID. Live work requires explicit
    authorized submission. Personal numerical defaults are not product ceilings; finite runtime-policy ceilings
    govern admission. Observable harness invocations are not opaque internal model/tool counts. No universal compatibility,
    guaranteed cancellation, billing or accuracy claims. Confirmed design scope includes provider API tools, local
    agent applications, SDKs/CLIs, MCP tools and hosted agent services. Compatibility/implementation are staged
    per adapter; none is implied live by inclusion in scope.
  license: {name: Apache License 2.0, identifier: Apache-2.0}
servers:
- {url: 'http://127.0.0.1:3000/api/v1'}
security:
- cookieAuth: []
tags:
- {name: Session}
- {name: Providers}
- {name: Conversations}
- {name: Runs}
paths:
  /session:
    get:
      tags: [Session]
      operationId: bootstrapSession
      summary: Bootstrap a local browser session without provider calls
      security: []
      description: Validate Host even here. Refresh may replace the session without losing saved conversations.
      responses:
        '200':
          description: Session cookie and CSRF token; no account or login.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Set-Cookie:
              description: HttpOnly; SameSite=Strict; Path=/api/v1; Secure under HTTPS. Never export or log.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: Page registered providers and configured model profiles
      description: Extensible validated adapter registry, initially targeting OpenAI/Anthropic/Gemini. Provider
        IDs are open registered strings; multiple profiles/backends per provider. No credentials, model discovery,
        CLI launch or provider calls.
      responses:
        '200':
          description: Provider metadata and server live-mode enablement.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderList'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/PageLimit'}
      - {$ref: '#/components/parameters/CatalogQuery'}
  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: Page conversations by newest update, with UUID tie-break
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/PageLimit'}
      responses:
        '200':
          description: Live view; updates can move records between pages.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a blank conversation
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, minLength: 1, maxLength: 200, default: New conversation}
      responses:
        '201':
          description: Blank conversation created.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}:
    parameters:
    - {$ref: '#/components/parameters/ConversationId'}
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Read conversation metadata
      responses:
        '200':
          description: Conversation metadata.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation and its associated local records
      description: Returns 204 even for an absent valid UUID. Any active run in this conversation blocks deletion.
        Logical deletion is not forensic erasure of backups, SQLite pages, exports, or provider data.
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - {$ref: '#/components/parameters/Origin'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}/messages:
    parameters:
    - {$ref: '#/components/parameters/ConversationId'}
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: Page messages in stable chronological sequence
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/PageLimit'}
      responses:
        '200':
          description: User prompts and final presentations; drafts remain run artifacts.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}/runs:
    parameters:
    - {$ref: '#/components/parameters/ConversationId'}
    post:
      tags: [Runs]
      operationId: createRun
      summary: Atomically save prompt and configuration and enqueue one run
      description: Resolve durable idempotency before the single global active-run guard, including waiting/approval
        states. Freeze profile/backend/capability/runtime-policy/grant versions and safe context atomically with
        prompt/run/key/event. Reject unique-ID, membership, readiness, control, scope, context and finite deployment-policy
        violations before dispatch. Repeated provider/profile roots and larger teams within deployment policy are
        valid. All-peers base plan is not dynamic internal work; no blind global 32 internal-call promise. No new
        destinations/grants or silent synthesizer replacement. Returns queued, not a completed answer.
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - {$ref: '#/components/parameters/Origin'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCreate'}
            examples:
              mockTeam:
                summary: 'Default three-root mock team: seven base calls, no paid requests'
                value:
                  prompt: Compare these options and keep unsupported claims unresolved.
                  mode: team
                  execution_mode: mock
                  agents:
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1, name: First perspective, profile_id: openai-default}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2, name: Second perspective, profile_id: anthropic-default}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa3, name: Third perspective, profile_id: gemini-default}
                  synthesizer_agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
              sameProviderTeam:
                summary: Two distinct agents using one provider/profile are legal
                value:
                  prompt: Review the supplied reasoning from two perspectives.
                  mode: team
                  agents:
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1, name: Analyst, profile_id: openai-default}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2, name: Skeptic, profile_id: openai-default,
                    role: Challenge unsupported assumptions.}
                  synthesizer_agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                  delegation:
                    enabled: true
                    allowed_profile_ids: []
                  tool_policy: {mode: 'off'}
              quickWithHelpers:
                summary: Explicit Quick helpers opt-in; base remains one unreviewed root call
                value:
                  prompt: Check this calculation using a bounded helper if useful.
                  mode: quick
                  agents:
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1, name: Responder, profile_id: openai-default}
                  delegation:
                    enabled: true
                    allowed_profile_ids: [anthropic-default]
              customProvider:
                summary: A registered custom provider/profile is legal; not universal live support
                value:
                  prompt: Compare the supplied facts.
                  mode: team
                  agents:
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1, name: Local analyst, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2, name: Second analyst, profile_id: lab-text}
                  synthesizer_agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
                  delegation: {enabled: false}
                  tool_policy: {mode: 'off'}
              largeTeamWithinPolicy:
                summary: Eight roots may be admitted only if runtime ceilings/context/budget permit
                value:
                  prompt: Compare the supplied alternatives without inventing evidence.
                  mode: team
                  agents:
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000001, name: Perspective 1, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000002, name: Perspective 2, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000003, name: Perspective 3, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000004, name: Perspective 4, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000005, name: Perspective 5, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000006, name: Perspective 6, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000007, name: Perspective 7, profile_id: lab-text}
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000008, name: Perspective 8, profile_id: lab-text}
                  synthesizer_agent_id: aaaaaaaa-aaaa-4aaa-8aaa-000000000001
                  delegation: {enabled: false}
                  tool_policy: {mode: 'off'}
                  limits: {max_root_agents: 8, max_total_agents: 16, max_harness_invocations: 32}
              autoSearch:
                summary: Auto tool selection within explicit allowed routes and an existing task grant
                value:
                  prompt: Find sources for this public claim.
                  mode: quick
                  agents:
                  - {agent_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1, name: Researcher, profile_id: anthropic-search}
                  tool_policy:
                    mode: auto
                    allowed_tool_ids: [anthropic.web_search]
                    allowed_backend_ids: [anthropic-messages]
                    allowed_profile_ids: [anthropic-search]
                    grant_refs: [ffffffff-ffff-4fff-8fff-fffffffffff1]
                    bounds_mode: strict
      responses:
        '201': {$ref: '#/components/responses/RunCreated'}
        '200': {$ref: '#/components/responses/RunReplay'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}:
    parameters:
    - {$ref: '#/components/parameters/RunId'}
    get:
      tags: [Runs]
      operationId: getRun
      summary: Read a run snapshot without starting or resuming work
      description: Read current lineage, observable accounting, external status and first-page tool records/cursor.
        Tool/provider denials are run data, not HTTP 500. Does not execute/resume work; no raw credentials/vendor/private
        reasoning traces.
      responses:
        '200': {$ref: '#/components/responses/RunSnapshot'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/cancellation:
    parameters:
    - {$ref: '#/components/parameters/RunId'}
    put:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation and return the current snapshot
      description: Idempotent local workflow cancellation across descendants/tools/continuations/native jobs. Completion
        may win. Stop new scheduling; request remote stop, never undo completed side effects. If remote completion
        is unknown retain unknown/orphaned external status; do not claim cancellation/refund. Workflow terminal
        state remains immutable while separate external status/usage reconciliation can append records. Never auto-resubmit
        after restart.
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - {$ref: '#/components/parameters/Origin'}
      responses:
        '200': {$ref: '#/components/responses/RunSnapshot'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/events:
    parameters:
    - {$ref: '#/components/parameters/RunId'}
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Replay durable bounded stage events using SSE
      description: Read-only persisted run-scoped SSE replay; disconnect does not cancel/duplicate work. Last-Event-ID
        absent replays after zero; malformed/negative/future IDs return 400. Event name equals EventEnvelope.type.
        Includes lineage, routes, approvals, tool results and scoped usage; no raw token stream/private reasoning.
        Close after workflow terminal event; later external reconciliation is available by snapshot/tool pages and
        a fresh explicit replay. Return 204 when cursor is already at the latest terminal sequence. Never auto-resume
        or fake remote cancellation. If a terminal run has newer reconciliation records after the cursor, replay
        them and close when caught up; 204 only when terminal and already at the latest stored sequence.
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
      responses:
        '200':
          description: SSE frames with durable numeric IDs and JSON event data.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            text/event-stream:
              schema: {type: string}
              example: 'id: 4

                event: tool.updated

                data: {"run_id":"11111111-1111-4111-8111-111111111111","sequence":4,"type":"tool.updated","at":"2026-10-17T02:00:01Z","data":{"tool_execution_id":"eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1","sequence":1,"run_id":"11111111-1111-4111-8111-111111111111","agent_id":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1","step_id":"cccccccc-cccc-4ccc-8ccc-ccccccccccc1","parent_invocation_id":"dddddddd-dddd-4ddd-8ddd-ddddddddddd1","provider_tool_call_id":"call-search-1","request":{"capability_id":"web.search","arguments":{"query":"Source
                for the supplied public claim"}},"argument_digest":"sha256:8d65bc5c613a55376a5e4353e4eef3ce41f8db15be41108fb937fa6c548ff4ea","arguments_preview":"query:
                Source for the supplied public claim","route_decisions":[{"route_decision_id":"eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee2","tool_execution_id":"eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1","run_id":"11111111-1111-4111-8111-111111111111","agent_id":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1","step_id":"cccccccc-cccc-4ccc-8ccc-ccccccccccc1","parent_invocation_id":"dddddddd-dddd-4ddd-8ddd-ddddddddddd1","provider_tool_call_id":"call-search-1","capability_id":"web.search","route":"direct","selected_tool_id":"anthropic.web_search","selected_profile_id":"anthropic-search","selected_backend_id":"anthropic-messages","delegated_agent_id":null,"grant_refs":["ffffffff-ffff-4fff-8fff-fffffffffff1"],"policy_version":"personal-v2","catalog_version":"catalog-v2","reason_code":"matching_task_grant","notice":"Illustrative
                authorized direct search; no actual request was made.","created_at":"2026-10-17T02:00:00Z"}],"approval":null,"status":"completed","execution_backend_id":"anthropic-messages","native_job_id":null,"external_status":"completed","bounds_mode":"strict","execution_controls":{"strict_bounds_supported":true,"supported_controls":["harness_invocations","tool_operations","deadline","context_isolation","delegation_disabled"],"max_internal_model_invocations":1,"max_internal_tool_operations":1,"max_job_seconds":120,"job_deadline_enforced":true,"tool_permission_gate":"before_each","context_isolation":"verified","notes":"Illustrative
                deterministic mock control mapping, not a tested live backend."},"deadline_at":"2026-10-17T02:00:45Z","result":"Illustrative
                search result; support has not been assessed.","sources":[{"claim":"The source discusses the supplied
                claim.","reference":"https://example.com/source","provenance":"provider_tool","retrieval_status":"retrieved","retrieved_at":"2026-10-17T02:00:01Z","tool_execution_id":"eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1","origin":"https://example.com","location":"Illustrative
                retrieved excerpt","support_status":"unassessed","assessment_method":"none","support_checked_at":null,"assessment_note":"Retrieved
                does not mean verified."}],"usage":{"harness_invocations":1,"tool_operations_observed":1,"native_jobs_started":0,"internal_usage_visibility":"complete","internal_model_invocations":0,"internal_tool_operations":0,"input_tokens":null,"output_tokens":null,"reserved_output_tokens":0,"token_scope":"simulated","accounting":"simulated","estimated_cost_usd":0,"cost_scope":"simulated","pricing_version":null},"limitations":["Hypothetical
                response shape only; no live tool integration is implemented."],"created_at":"2026-10-17T02:00:00Z","updated_at":"2026-10-17T02:00:01Z","finished_at":"2026-10-17T02:00:01Z"}}


                '
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversation_id}/export:
    parameters:
    - {$ref: '#/components/parameters/ConversationId'}
    get:
      tags: [Conversations]
      operationId: exportConversation
      summary: Export portable version-1 JSON after all conversation runs terminate
      description: Full logical version-1 export includes every terminal run tree, route/tool/approval/source record
        and scoped usage, not first-page previews. Contains user/task text; disclose before download. Exclude credentials/cookies/CSRF/raw
        vendor/hidden reasoning data. Any active/waiting/approval run returns 409. Unknown/orphaned external work
        may remain after local cancellation/deletion.
      responses:
        '200':
          description: Full logical conversation export, not a paginated list.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Content-Disposition:
              schema: {type: string}
              example: attachment; filename="proofestra-conversation.json"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationExport'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /capabilities:
    get:
      tags: [Providers]
      operationId: listCapabilities
      summary: Page compatible tool/profile/backend metadata without executing tools
      description: Filter by registered metadata. Compatibility evidence/readiness/auth/grants/egress/observability
        are separate; no claim of universal tool/model/mode support. Cursors bind catalog version and filters.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/PageLimit'}
      - {$ref: '#/components/parameters/CatalogQuery'}
      - {$ref: '#/components/parameters/ProviderFilter'}
      - {$ref: '#/components/parameters/ProfileFilter'}
      - {$ref: '#/components/parameters/BackendFilter'}
      - {$ref: '#/components/parameters/BackendKindFilter'}
      responses:
        '200':
          description: Versioned paginated capability registry.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /runtime-policy:
    get:
      tags: [Providers]
      operationId: getRuntimePolicy
      summary: Read versioned personal defaults and finite deployment ceilings
      description: No mutation or provider calls. Requests cannot raise server ceilings; snapshot the effective
        version and reject stale/incompatible admission.
      responses:
        '200':
          description: Current effective server policy.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimePolicy'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/tool-executions:
    parameters:
    - {$ref: '#/components/parameters/RunId'}
    get:
      tags: [Runs]
      operationId: listToolExecutions
      summary: Page all tool executions and their route/approval records
      description: Read-only stable execution sequence; updated status may change while paging. No silent omission
        from full exports; no tool execution/resume. Cursors are run scoped.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/PageLimit'}
      responses:
        '200':
          description: Current execution records in stable sequence.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolExecutionPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/tool-approvals:
    parameters:
    - {$ref: '#/components/parameters/RunId'}
    post:
      tags: [Runs]
      operationId: decideToolApproval
      summary: Record human approval or denial of one pending exact action
      description: Verify session/CSRF/Origin, pending record/run/caller/tool/profile/backend/task/policy bindings,
        exact argument digest, expiry and current run state. Same key/payload replays; changed decision/payload
        or stale/mismatched action returns 409. Approval never expands frozen allowlists or bypasses compatibility/budget.
        Consent is not execution. Models cannot invoke this browser-authorized operation or mint grants. Approval
        control surfaces and credentials are isolated from agent tools. Freeze initial scope; recheck current grant
        validity/revocation before execution. An action-scoped approval cannot widen tools/backends/profiles/destinations;
        broader changes need a new run.
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - {$ref: '#/components/parameters/Origin'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolApprovalInput'}
            examples:
              approveExactAction:
                value: {approval_request_id: ffffffff-ffff-4fff-8fff-fffffffffff2, tool_execution_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeee1,
                  argument_digest: 'sha256:8d65bc5c613a55376a5e4353e4eef3ce41f8db15be41108fb937fa6c548ff4ea', decision: approve}
      responses:
        '200':
          description: Stable exact-action decision, including idempotent replay.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolApprovalResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: proofestra_session, description: Local-browser HttpOnly SameSite=Strict
        session; Secure under HTTPS. Not multi-user authentication.}
    csrfToken: {type: apiKey, in: header, name: X-CSRF-Token, description: Required with cookieAuth on mutations;
        must match the bootstrapped session token. Also validate Origin.}
  headers:
    NoStore:
      required: true
      schema: {type: string, const: no-store}
    RequestId:
      required: true
      description: Server-generated correlation UUID; no sensitive content.
      schema: {type: string, format: uuid}
    Location:
      description: Same-origin relative URI identifying the resource, including on idempotent replay.
      schema: {type: string, format: uri-reference}
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured canonical origin, default http://127.0.0.1:3000. Never accept
        null or a wildcard.
      schema: {type: string, format: uri}
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      description: Opaque endpoint/conversation-scoped cursor. Invalid/deleted scope is 400; deletion invalidates
        associated cursors.
      schema: {type: string, minLength: 1, maxLength: 2048}
    PageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    CatalogQuery:
      name: q
      in: query
      required: false
      schema: {type: string, maxLength: 200, minLength: 1}
      description: Search registered metadata; query is not sent to a provider.
    ProviderFilter:
      name: provider
      in: query
      required: false
      schema: {$ref: '#/components/schemas/Provider'}
    ProfileFilter:
      name: profile_id
      in: query
      required: false
      schema: {$ref: '#/components/schemas/ProfileId'}
    BackendFilter:
      name: backend_id
      in: query
      required: false
      schema: {$ref: '#/components/schemas/BackendId'}
    BackendKindFilter:
      name: backend_kind
      in: query
      required: false
      schema: {$ref: '#/components/schemas/BackendKind'}
  responses:
    Error:
      description: 'Standard safe error envelope. 400 malformed request/cursor/event ID;

        401 missing session; 403 Host/origin/CSRF denied; 404 unknown parent/run;

        409 active-run or idempotency conflict; 413 body over 128 KiB;

        422 semantic validation/live readiness/context capacity; 429 local admission

        limiting; 500 unexpected internal error. Retry-After is required on 429.

        Field details never echo sensitive values. Default also covers these

        API-wide failures when not separately listed for an operation.

        '
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After:
          description: Required only for 429; seconds before retrying local admission.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            activeRun:
              value:
                error:
                  code: run_in_progress
                  message: Cancel or wait for the active run before starting another.
                  request_id: 22222222-2222-4222-8222-222222222222
                  details: []
            contextTooLarge:
              value:
                error:
                  code: context_too_large
                  message: The complete history cannot safely fit this team. Start a new conversation.
                  request_id: 22222222-2222-4222-8222-222222222222
                  details:
                  - {field: prompt, code: context_capacity_exceeded}
    RateLimited:
      description: Local admission limit; preserve Idempotency-Key when retrying a start. No provider call has been
        admitted by this response.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After:
          required: true
          description: Seconds before retrying local admission.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NoContent:
      description: Success without a response body.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
    RunCreated:
      description: Newly saved queued run; no answer is implied.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Location: {$ref: '#/components/headers/Location'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunSnapshot'}
    RunReplay:
      description: Original run for the same key and normalized payload; preserve original configuration and limits.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Location: {$ref: '#/components/headers/Location'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunSnapshot'}
    RunSnapshot:
      description: Current bounded run snapshot; reads never submit work.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunSnapshot'}
  schemas:
    Provider:
      type: string
      maxLength: 80
      minLength: 1
      pattern: ^[a-z][a-z0-9_.:-]*$
      description: Open registered provider ID, not an enum. Initial targets are openai, anthropic and gemini; custom
        IDs require a validated operator-installed adapter manifest.
    Session:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string, minLength: 32, maxLength: 256, writeOnly: false}
    ProviderConfig:
      type: object
      additionalProperties: false
      required: [provider, label, adapter_manifest_version, profiles]
      properties:
        provider: {$ref: '#/components/schemas/Provider'}
        label: {type: string, maxLength: 100, minLength: 1}
        adapter_manifest_version: {type: string, maxLength: 200, minLength: 1}
        profiles:
          type: array
          items: {$ref: '#/components/schemas/ModelProfile'}
          minItems: 0
      description: Operator-registered adapter with configured profiles. Profile IDs are globally unique; profile
        counts are bounded by deployment policy, not a product-wide constant.
    ProviderList:
      type: object
      additionalProperties: false
      required: [live_enabled, catalog_version, items, next_cursor]
      properties:
        live_enabled: {type: boolean}
        catalog_version: {type: string, maxLength: 100, minLength: 1}
        items:
          type: array
          items: {$ref: '#/components/schemas/ProviderConfig'}
          minItems: 0
          maxItems: 100
        next_cursor:
          type: [string, 'null']
          maxLength: 2048
      description: Paginated extensible provider registry. Core targets are not a promise that exactly three entries
        exist or every listed tool is implemented.
      examples:
      - live_enabled: false
        catalog_version: illustrative-v1
        items:
        - provider: research-lab
          label: Illustrative custom provider
          adapter_manifest_version: example-v1
          profiles:
          - profile_id: lab-text
            model_id: operator-pinned-model
            safe_input_tokens: 64000
            readiness: configured
            delegation_capability: supported
            execution_backend_id: lab-api
            execution_controls:
              strict_bounds_supported: true
              supported_controls: [harness_invocations, tool_operations, deadline, context_isolation, delegation_disabled]
              max_internal_model_invocations: 1
              max_internal_tool_operations: 1
              max_job_seconds: 120
              job_deadline_enforced: true
              tool_permission_gate: before_each
              context_isolation: verified
              notes: Illustrative deterministic mock control mapping, not a tested live backend.
        next_cursor: null
    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Conversation'}
        next_cursor:
          type: [string, 'null']
    Message:
      type: object
      additionalProperties: false
      required: [id, conversation_id, run_id, role, text, sequence, created_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        role:
          type: string
          enum: [user, assistant]
        text: {type: string, maxLength: 65536}
        sequence: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Message'}
        next_cursor:
          type: [string, 'null']
    RunCreate:
      type: object
      additionalProperties: false
      required: [prompt, mode, agents]
      properties:
        prompt: {type: string, minLength: 1, maxLength: 16000}
        mode:
          type: string
          enum: [quick, team]
        execution_mode:
          type: string
          enum: [mock, live]
          default: mock
        agents:
          type: array
          items: {$ref: '#/components/schemas/AgentDefinition'}
          minItems: 1
        synthesizer_agent_id:
          type: [string, 'null']
          format: uuid
        delegation: {$ref: '#/components/schemas/DelegationInput'}
        limits: {$ref: '#/components/schemas/RunLimitsInput'}
        review_topology:
          type: string
          enum: [all_peers]
          default: all_peers
        tool_policy: {$ref: '#/components/schemas/ToolPolicyInput'}
        expected_catalog_version: {type: string, minLength: 1, maxLength: 100}
        expected_runtime_policy_version: {type: string, minLength: 1, maxLength: 100}
      description: Quick requires one root and no synthesizer; Team at least two roots and a root synthesizer_agent_id.
        Repeated providers/profiles are valid; unique IDs/membership/profile/control/grant checks are application
        invariants. Provider IDs/catalog are extensible. Freeze profiles, backend/capability/policy versions, context
        and authorized scopes; reject before dispatch if base work cannot fit. all_peers plans 2n+1 base harness
        calls, not fixed dynamic work. Other review topologies remain future designs. Personal default root count
        6 may be raised only within advertised deployment ceilings. Client input cannot contain raw model IDs, credentials,
        lineage, new grants or arbitrary adapter definitions. Live submissions bind the displayed expected_catalog_version
        and expected_runtime_policy_version; changed registry/policy returns 409 before dispatch. Recheck current
        grant validity/revocation before every action, without broadening frozen scope.
      allOf:
      - if:
          properties:
            mode: {const: quick}
          required: [mode]
        then:
          properties:
            agents: {maxItems: 1}
            synthesizer_agent_id: {type: 'null'}
        else:
          required: [synthesizer_agent_id]
          properties:
            agents: {minItems: 2}
            synthesizer_agent_id: {type: string, format: uuid}
      - if:
          allOf:
          - properties:
              mode: {const: quick}
            required: [mode]
          - not:
              required: [delegation]
              properties:
                delegation:
                  required: [enabled]
                  properties:
                    enabled: {const: true}
          - not:
              required: [tool_policy]
              properties:
                tool_policy:
                  required: [mode]
                  properties:
                    mode: {const: auto}
        then:
          properties:
            limits:
              properties:
                max_harness_invocations: {const: 1}
                max_retries_per_step: {const: 0}
      - if:
          properties:
            execution_mode: {const: live}
          required: [execution_mode]
        then:
          required: [expected_catalog_version, expected_runtime_policy_version]
    RunLimitsInput:
      type: object
      additionalProperties: false
      required: []
      properties:
        max_harness_invocations: {type: integer, minimum: 1}
        max_tool_operations: {type: integer, minimum: 0, default: 64}
        max_native_jobs: {type: integer, minimum: 0, default: 4}
        concurrency: {type: integer, minimum: 1, default: 3}
        per_provider_concurrency: {type: integer, minimum: 1, default: 2}
        overall_timeout_seconds: {type: integer, minimum: 15, default: 300}
        per_call_timeout_seconds: {type: integer, minimum: 1, default: 45}
        max_native_job_seconds: {type: integer, minimum: 1, default: 120}
        max_output_tokens_per_call: {type: integer, minimum: 1, default: 2048}
        total_output_tokens: {type: integer, minimum: 1, default: 65536}
        max_retries_per_step: {type: integer, minimum: 0, maximum: 1}
        max_root_agents: {type: integer, minimum: 1, default: 6}
        max_total_agents: {type: integer, minimum: 1, default: 12}
        max_spawned_agents: {type: integer, minimum: 0, default: 6}
        max_children_per_agent: {type: integer, minimum: 0, default: 2}
        max_depth: {type: integer, minimum: 0, default: 2}
      description: Personal defaults, not hard-coded product ceilings. Default max_harness_invocations=32/retries=1
        except Quick with delegation disabled AND tool mode off uses 1/0. All omitted fields normalize under the
        versioned runtime policy. Requests can exceed personal defaults only within finite deployment ceilings.
        Validate root/base-stage/output/time/concurrency relationships before dispatch. Harness counts cover only
        coordinator-scheduled calls, not opaque native internals. Observable operation/job limits govern local admission;
        remote observations can arrive after execution. Strict routes must enforce requested controls, otherwise
        decline. Never promise a global internal-call or billing hard cap.
    RunLimits:
      allOf:
      - {$ref: '#/components/schemas/RunLimitsInput'}
      - required: [max_harness_invocations, max_tool_operations, max_native_jobs, concurrency, per_provider_concurrency,
          overall_timeout_seconds, per_call_timeout_seconds, max_native_job_seconds, max_output_tokens_per_call,
          total_output_tokens, max_retries_per_step, max_root_agents, max_total_agents, max_spawned_agents, max_children_per_agent,
          max_depth]
    RunStatus:
      type: string
      enum: [queued, running, waiting_for_tool, awaiting_approval, waiting_for_children, completed, partial, failed,
        canceled, interrupted]
    TerminalStatus:
      type: string
      enum: [completed, partial, failed, canceled, interrupted]
    StepStatus:
      type: string
      enum: [queued, running, waiting_for_children, waiting_for_tool, awaiting_approval, completed, failed, skipped,
        timed_out, canceled, interrupted]
    AgentSnapshot:
      type: object
      additionalProperties: false
      required: [agent_id, name, profile_id, role, provider, model_id, safe_input_tokens, delegation_capability,
        parent_agent_id, root_agent_id, depth, task, child_agent_ids, status, execution_backend_id]
      properties:
        agent_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        profile_id: {$ref: '#/components/schemas/ProfileId'}
        role:
          type: [string, 'null']
          maxLength: 500
        provider: {$ref: '#/components/schemas/Provider'}
        model_id: {type: string, minLength: 1, maxLength: 200}
        safe_input_tokens: {type: integer, minimum: 1}
        delegation_capability: {$ref: '#/components/schemas/DelegationCapability'}
        parent_agent_id:
          type: [string, 'null']
          format: uuid
        root_agent_id: {type: string, format: uuid}
        depth: {type: integer, minimum: 0}
        task:
          type: [string, 'null']
          maxLength: 4000
        child_agent_ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 0
          uniqueItems: true
        status: {$ref: '#/components/schemas/AgentStatus'}
        execution_backend_id: {$ref: '#/components/schemas/BackendId'}
      description: Run-scoped runtime identity. Roots have parent null, root_agent_id=self, depth=0 and task=null;
        children have an existing parent, inherited root ID, depth=parent+1 and bounded assigned task. Validate
        acyclic same-run links, unique IDs, reciprocal child lists and lifetime quotas in application logic. Identical
        provider/profile does not merge agents.
      allOf:
      - if:
          properties:
            parent_agent_id: {type: 'null'}
          required: [parent_agent_id]
        then:
          properties:
            depth: {const: 0}
            task: {type: 'null'}
        else:
          properties:
            depth: {minimum: 1}
            task: {type: string, minLength: 1}
    ContextSnapshot:
      type: object
      additionalProperties: false
      required: [policy, message_ids, input_fit_status]
      properties:
        policy: {type: string, const: all_history_v1}
        message_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        input_fit_status: {type: string, const: accepted}
        notice: {type: string, maxLength: 1000}
      description: Frozen all visible history plus current prompt; records the exact included message IDs. Fit is
        a conservative local estimate, not guaranteed vendor counting. No hidden per-provider trimming. Children
        reuse this history plus scoped task/authorized branch artifacts; drafting branches cannot see current peer-root
        drafts. Recheck child/continuation capacity before dispatch.
    Usage:
      type: object
      additionalProperties: false
      required: [harness_invocations, tool_operations_observed, native_jobs_started, internal_usage_visibility,
        internal_model_invocations, internal_tool_operations, input_tokens, output_tokens, reserved_output_tokens,
        token_scope, accounting, estimated_cost_usd, cost_scope, pricing_version]
      properties:
        harness_invocations: {type: integer, minimum: 0}
        tool_operations_observed: {type: integer, minimum: 0}
        native_jobs_started: {type: integer, minimum: 0}
        internal_usage_visibility:
          type: string
          enum: [complete, partial, opaque, unknown]
        internal_model_invocations:
          type: [integer, 'null']
          minimum: 0
        internal_tool_operations:
          type: [integer, 'null']
          minimum: 0
        input_tokens:
          type: [integer, 'null']
          minimum: 0
        output_tokens:
          type: [integer, 'null']
          minimum: 0
        reserved_output_tokens: {type: integer, minimum: 0}
        token_scope:
          type: string
          enum: [harness_only, whole_tree, partial, unknown, simulated]
        accounting:
          type: string
          enum: [reported, conservative, unknown, simulated]
        estimated_cost_usd:
          type: [number, 'null']
          minimum: 0
        cost_scope:
          type: string
          enum: [reported_total, observed_only, partial, unknown, simulated]
        pricing_version:
          type: [string, 'null']
          maxLength: 200
      description: Scope-aware ledger. Harness invocations count calls the coordinator dispatches, including initial/child/continuation/retry
        calls and one outer native-job launch; do not infer internal calls from that count. Observed tool operations/native
        jobs are distinct counters. Nullable internal counts/cost remain unknown, never zero by assumption. Whole-tree
        totals require actual complete reporting; opaque SDK/server-tool work may remain incomplete. Remote observations
        can arrive after local admission/cancellation; keep them separately reconcilable without resuming the workflow.
        Cost is an estimate, never a billing guarantee. Simulation is labeled explicitly.
    NormalizedFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [authentication, rate_limited, model_unavailable, invalid_request, provider_unavailable, timeout,
            context_too_large, budget_exhausted, canceled, interrupted, unknown]
        message: {type: string, maxLength: 500}
      description: Safe concise message, never raw vendor response, secrets, or stack trace.
    Source:
      type: object
      additionalProperties: false
      required: [claim, reference, provenance, retrieval_status, retrieved_at, tool_execution_id, origin, location,
        support_status, assessment_method, support_checked_at, assessment_note]
      properties:
        claim: {type: string, maxLength: 2000}
        reference: {type: string, maxLength: 2048}
        provenance:
          type: string
          enum: [model_supplied, provider_tool, host_tool, user_supplied, mcp_tool]
        retrieval_status:
          type: string
          enum: [not_retrieved, retrieved, failed, unknown]
        retrieved_at:
          type: [string, 'null']
          format: date-time
        tool_execution_id:
          type: [string, 'null']
          format: uuid
        origin:
          type: [string, 'null']
          maxLength: 2048
        location:
          type: [string, 'null']
          maxLength: 2000
        support_status:
          type: string
          enum: [unassessed, supported, disputed, insufficient, unknown]
        assessment_method:
          type: string
          enum: [none, model_review, human_review, source_comparison]
        support_checked_at:
          type: [string, 'null']
          format: date-time
        assessment_note: {type: string, maxLength: 2000}
      description: 'Retrieval and claim support are separate: retrieved is never automatically verified. Preserve
        exact source origin/location/time and checking method. A model opinion is not ground truth. Model-supplied
        URLs start not_retrieved/unassessed.'
    Finding:
      type: object
      additionalProperties: false
      required: [agent_id, step_id, text]
      properties:
        agent_id: {type: string, format: uuid}
        step_id: {type: string, format: uuid}
        text: {type: string, maxLength: 2000}
      description: Concise model finding with identity/provenance, never private reasoning. IDs refer to the containing
        run/step.
    StepSnapshot:
      type: object
      additionalProperties: false
      required: [step_id, agent_id, stage, provider, status, attempts, invocations, output, findings, sources, usage,
        failure]
      properties:
        step_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        stage:
          type: string
          enum: [draft, review, synthesis, helper]
        provider: {$ref: '#/components/schemas/Provider'}
        status: {$ref: '#/components/schemas/StepStatus'}
        attempts: {type: integer, minimum: 0}
        invocations:
          type: array
          items: {$ref: '#/components/schemas/InvocationSnapshot'}
          minItems: 0
        output:
          type: [string, 'null']
          maxLength: 65536
        findings:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
          minItems: 0
          maxItems: 20
        sources:
          type: array
          items: {$ref: '#/components/schemas/Source'}
          minItems: 0
          maxItems: 20
        usage: {$ref: '#/components/schemas/Usage'}
        failure:
          oneOf:
          - {$ref: '#/components/schemas/NormalizedFailure'}
          - {type: 'null'}
      description: Unique stage/task identity. attempts counts coordinator-dispatched harness invocations for this
        step, including resumes/retries, not opaque internal model calls. Waiting for children/tools/approval releases
        local execution permits; deadline/reservations remain. Sum actual harness calls within effective policy;
        helper work is not a root vote. No raw vendor/private reasoning traces.
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [id, conversation_id, user_message_id, mode, execution_mode, status, root_agent_ids, agents, synthesizer_agent_id,
        delegation, context, prompt_version, limits, base_planned_calls, steps, spawn_decisions, final_answer, presentation,
        limitations, usage, created_at, finished_at, last_event_sequence, review_topology, runtime_policy_version,
        catalog_version, tool_policy, tool_executions, tool_executions_next_cursor, external_work_status]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        user_message_id: {type: string, format: uuid}
        mode:
          type: string
          enum: [quick, team]
        execution_mode:
          type: string
          enum: [mock, live]
        status: {$ref: '#/components/schemas/RunStatus'}
        root_agent_ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 1
          uniqueItems: true
        agents:
          type: array
          items: {$ref: '#/components/schemas/AgentSnapshot'}
          minItems: 1
        synthesizer_agent_id:
          type: [string, 'null']
          format: uuid
        delegation: {$ref: '#/components/schemas/DelegationPolicy'}
        context: {$ref: '#/components/schemas/ContextSnapshot'}
        prompt_version: {type: string, minLength: 1, maxLength: 100}
        limits: {$ref: '#/components/schemas/RunLimits'}
        base_planned_calls: {type: integer, minimum: 1}
        steps:
          type: array
          items: {$ref: '#/components/schemas/StepSnapshot'}
          minItems: 0
        spawn_decisions:
          type: array
          items: {$ref: '#/components/schemas/SpawnDecision'}
          minItems: 0
          description: Complete accepted/denied decisions under the run deadline and bounded model output; do not
            truncate away denials in exports.
        final_answer:
          type: [string, 'null']
          maxLength: 65536
        presentation:
          type: string
          enum: [none, quick_unreviewed, team_synthesis, draft_fallback]
        limitations:
          type: array
          items: {type: string, maxLength: 1000}
          minItems: 0
          maxItems: 100
